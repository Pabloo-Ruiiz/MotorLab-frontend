<!-- Las regiones deben existir antes que los avisos para que los lectores de pantalla los anuncien -->
<div class="toasts">
  @for (region of regiones(); track region.rol) {
    <div class="toasts__region" [attr.role]="region.rol">
      @for (aviso of region.avisos; track aviso.id) {
        <div [class]="'toast toast--' + aviso.tipo">
          <span class="toast__icono" aria-hidden="true">{{ iconos[aviso.tipo] }}</span>
          <p class="toast__mensaje">{{ aviso.mensaje }}</p>
          <button
            type="button"
            class="toast__cerrar"
            aria-label="Cerrar aviso"
            (click)="toast.quitar(aviso.id)"
          >
            <span aria-hidden="true">×</span>
          </button>
        </div>
      }
    </div>
  }
</div>
