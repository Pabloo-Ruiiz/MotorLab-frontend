<!-- Las regiones deben existir antes que los avisos para que los lectores de pantalla los anuncien -->
<div class="toasts">
  @for (region of regiones(); track region.rol) {
    <div class="toasts__region" [attr.role]="region.rol">
      @for (aviso of region.avisos; track aviso.id) {
        <div [class]="'toast toast--' + aviso.tipo" animate.leave="toast--saliendo">
          <svg
            class="toast__icono"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path [attr.d]="iconos[aviso.tipo]" />
          </svg>
          <p class="toast__mensaje">{{ aviso.mensaje }}</p>
          <button
            type="button"
            class="toast__cerrar"
            aria-label="Cerrar aviso"
            (click)="toast.quitar(aviso.id)"
          >
            <svg
              class="toast__x"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
      }
    </div>
  }
</div>
