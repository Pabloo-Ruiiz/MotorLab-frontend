<dialog
  #dialogo
  class="visor"
  [attr.aria-labelledby]="idTitulo"
  (click)="alPulsar($event)"
  (close)="alCerrar()"
>
  @if (mostrada(); as persona) {
    <div class="visor__marco">
      <header class="visor__cabecera">
        <div>
          <h2 class="visor__titulo" [id]="idTitulo">{{ persona.nombre }}</h2>
          @if (persona.rol; as rol) {
            <p class="visor__rol">{{ etiquetasRol[rol] }}</p>
          }
        </div>
        <button type="button" class="visor__cerrar" aria-label="Cerrar" (click)="cerrar.emit()">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </header>

      <div class="visor__imagen">
        @if (persona.foto; as foto) {
          <img [src]="foto" [alt]="'Foto de perfil de ' + persona.nombre" />
        } @else {
          <app-avatar class="visor__avatar" [nombre]="persona.nombre" [rol]="persona.rol" />
        }
      </div>
    </div>
  }
</dialog>
