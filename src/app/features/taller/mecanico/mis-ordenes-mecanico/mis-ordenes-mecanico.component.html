<main class="mis-ordenes">
  <header>
    <h1>Mis órdenes</h1>
    <p class="subtitulo">{{ subtitulo() }}</p>
  </header>

  @if (cargando()) {
    <app-cargando />
  } @else if (errorCarga(); as error) {
    <div class="aviso aviso--rojo" role="alert">{{ error }}</div>
    <button type="button" class="btn btn--secundario reintentar" (click)="cargar()">
      Reintentar
    </button>
  } @else {
    @if (activas().length > 0) {
      <app-lista-ordenes-mecanico [ordenes]="activas()" />
    } @else {
      <app-vacio
        [titulo]="
          finalizadas().length > 0
            ? 'No tienes órdenes activas'
            : 'Todavía no tienes órdenes asignadas'
        "
      />
    }

    @if (finalizadas().length > 0) {
      <details class="finalizadas">
        <summary class="finalizadas__titulo">Finalizadas ({{ finalizadas().length }})</summary>
        <app-lista-ordenes-mecanico [ordenes]="finalizadas()" />
      </details>
    }
  }
</main>
