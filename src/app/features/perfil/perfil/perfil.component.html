<app-logo class="filigrana" />

<main class="perfil">
  @if (usuario(); as usuario) {
    <section class="cuenta" aria-labelledby="perfil-nombre">
      <header class="cuenta__cabecera">
        <button
          type="button"
          class="avatar"
          title="Cambiar foto"
          aria-label="Cambiar foto"
          (click)="cambiandoFoto.set(true)"
        >
          @if (foto(); as foto) {
            <img class="avatar__foto" [src]="foto" alt="" />
          } @else {
            {{ iniciales() }}
          }
          <span class="avatar__camara">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 8h3l2-3h6l2 3h3v11H4V8ZM15.5 13a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z" />
            </svg>
          </span>
        </button>
        <div class="cuenta__identidad">
          <h1 class="cuenta__nombre" id="perfil-nombre">{{ usuario.nombre }}</h1>
          <span class="pill pill--gris">{{ etiquetasRol[usuario.rol] }}</span>
        </div>
      </header>

      <div class="cuenta__cuerpo">
        <dl class="datos">
          <div class="dato">
            <dt>
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M3 6h18v12H3zM3 7l9 6 9-6" />
              </svg>
              Correo electrónico
            </dt>
            <dd>{{ usuario.email }}</dd>
          </div>
          <div class="dato">
            <dt>
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"
                />
              </svg>
              Teléfono
            </dt>
            <dd>{{ usuario.telefono }}</dd>
          </div>
        </dl>
      </div>

      <footer class="cuenta__pie">
        <button type="button" class="btn btn--peligro" (click)="confirmandoCierre.set(true)">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9" />
          </svg>
          Cerrar sesión
        </button>
      </footer>
    </section>
  } @else {
    <app-vacio titulo="No se han podido cargar tus datos" />
    <!-- Sin datos no hay tarjeta, pero debe seguir siendo posible salir -->
    <button type="button" class="btn btn--peligro" (click)="confirmandoCierre.set(true)">
      Cerrar sesión
    </button>
  }

  <p class="perfil__nota">
    Consulta cómo tratamos tus datos en la
    <a routerLink="/privacidad" target="_blank" rel="noopener">Política de privacidad</a>.
  </p>
</main>

<app-cambiar-foto [abierto]="cambiandoFoto()" (cerrar)="cambiandoFoto.set(false)" />

<app-modal-confirmacion
  [abierto]="confirmandoCierre()"
  titulo="Cerrar sesión"
  mensaje="¿Seguro que quieres cerrar sesión?"
  textoConfirmar="Cerrar sesión"
  textoCancelar="Volver"
  (confirmar)="cerrarSesion()"
  (cancelar)="confirmandoCierre.set(false)"
/>
