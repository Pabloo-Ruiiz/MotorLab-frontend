<dialog #dialogo class="modal" aria-labelledby="cambiar-foto-titulo" (close)="alCerrar()">
  <h2 class="titulo" id="cambiar-foto-titulo">Cambiar foto</h2>

  @if (vista() === 'opciones') {
    <div class="opciones">
      <button type="button" class="opcion" (click)="usarCamara()">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 8h3l2-3h6l2 3h3v11H4V8ZM15.5 13a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z" />
        </svg>
        Tomar foto con la cámara
      </button>
      <button type="button" class="opcion" (click)="galeria.click()">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 5h16v14H4zM4 16l5-5 4 4 2-2 5 5M15.5 9.5h.01" />
        </svg>
        Seleccionar de la galería
      </button>
      @if (foto()) {
        <button type="button" class="opcion opcion--peligro" (click)="eliminar()">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
          </svg>
          Eliminar foto actual
        </button>
      }
    </div>

    <div class="acciones">
      <button type="button" class="btn btn--fantasma" (click)="salir()">Cancelar</button>
    </div>
  } @else {
    @if (errorCamara(); as error) {
      <div class="aviso aviso--rojo" role="alert">{{ error }}</div>
    } @else {
      <video
        #video
        class="visor"
        autoplay
        muted
        playsinline
        [srcObject]="flujo()"
        (loadedmetadata)="camaraLista.set(true)"
      ></video>
    }

    <div class="acciones">
      <button type="button" class="btn btn--fantasma" (click)="volverAOpciones()">Volver</button>
      @if (errorCamara() === null) {
        <button
          type="button"
          class="btn btn--primario"
          [disabled]="!camaraLista()"
          (click)="capturar()"
        >
          Capturar
        </button>
      }
    </div>
  }

  <input #galeria type="file" accept="image/*" hidden (change)="alElegirArchivo($event)" />
  <input
    #camaraNativa
    type="file"
    accept="image/*"
    capture="user"
    hidden
    (change)="alElegirArchivo($event)"
  />
</dialog>
